msg.pg.index.bcexDomicile=Btcside  \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u0430\u043D \u0438  \u044D\u043A\u0441\u043F\u043B\u0443\u0430\u0442\u0438\u0440\u0443\u0435\u0442\u0441\u044F  \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u0435\u0439 BitFuture  Group Ltd (\u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0439  BVI , \u043D\u043E\u043C\u0435\u0440 \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u0438  1941935 ). Btcside  - \u044D\u0442\u043E \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0430 \u0434\u043B\u044F \u0442\u043E\u0440\u0433\u043E\u0432\u043B\u0438 \u0431\u0435\u0441\u0441\u0440\u043E\u0447\u043D\u044B\u043C\u0438 \u043A\u043E\u043D\u0442\u0440\u0430\u043A\u0442\u0430\u043C\u0438 \u043D\u0430 \u0446\u0438\u0444\u0440\u043E\u0432\u044B\u0435 \u0430\u043A\u0442\u0438\u0432\u044B, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u043D\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043E\u0442 \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u0430? \u0441\u043F\u043E\u0442-\u043E\u0431\u043C\u0435\u043D\u0430.  Btcside \u0441\u0442\u0440\u0435\u043C\u0438\u0442\u0441\u044F \u0443\u043B\u0443\u0447\u0448\u0438\u0442\u044C \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u044E \u0430\u043A\u0442\u0438\u0432\u043E\u0432  \u0431\u043B\u043E\u043A\u0447\u0435\u0439\u043D\u0430, \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u044F \u043D\u0430\u0438\u0431\u043E\u043B\u0435\u0435 \u0441\u043F\u0435\u0446\u0438\u0430\u043B\u0438\u0437\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u0443\u0441\u043B\u0443\u0433\u0438 \u043F\u043E \u0442\u043E\u0440\u0433\u043E\u0432\u043B\u0435 \u0430\u043A\u0442\u0438\u0432\u0430\u043C\u0438 \u043F\u043E \u0431\u043B\u043E\u043A\u0447\u0435\u0439\u043D\u0443  \u0434\u043B\u044F \u043F\u043E\u043A\u043B\u043E\u043D\u043D\u0438\u043A\u043E\u0432 \u0433\u043B\u043E\u0431\u0430\u043B\u044C\u043D\u044B\u0445 \u0430\u043A\u0442\u0438\u0432\u043E\u0432  \u0431