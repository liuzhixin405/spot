msg.pg.index.bcexSalutation=Dear BCEX users\:
msg.pg.index.bcexOpenSenlence=In order to give you more block chain trading products, our strategic assets invested Btcside block chain contracts trading platform (hereinafter referred to as Btcside), and incorporated into the contract of trading BCEX.
msg.pg.index.bcexDomicile=Btcside is developed and operated by BitFuture Group Ltd (registered BVI , company number 1941935 ). Btcside is a digital asset perpetual contract trading platform that is independent of the subject matter of the spot exchange. Btcside is committed to improving the industry ecology of blockchain assets, providing the most specialized blockchain asset contract trading services to fans of global blockchain assets, creating the most fair, just and open blockchain asset contract trading platform. Let the blockchain asset contract transaction never be malicious again\! Btcside contract types include mainstream digital asset contracts such as BTC , ETH , and EOS , high-end platform FT , HT and other contracts, as well as popular innovative currency contracts. In addition, Btcside also focused on creating a simulated contract trading zone. Users interested in contract trading can not only achieve zero-cost training, but also rich trading prizes\!
msg.pg.index.bcexContspac="Contract" here refers to the collective name of various standardized trading products developed by the Btcside platform. The contract terms stipulate the setting elements of each product, requiring the buyer (also called multi-party) and the seller (also known as the empty party). ) to comply with each other and to pay by paying a certain percentage of USDT as a deposit.
msg.pg.index.bcexContspecty=The main features of Btcside contract transactions are\:
msg.pg.index.bcexContspecty1=1. and perpetual contract transactions, as long as the user's contract account balance is sufficient, it can be held for a long time to avoid frequent delivery;
msg.pg.index.bcexContspecty2=2. Support USDT , BTC , ETH , CK.USD and other mainstream assets and deposits;
msg.pg.index.bcexContspecty3=3. Index price wear-in to avoid manipulation. Btcside original index price flat trigger mode, the wear-through point is triggered according to the index price, and the index price is calculated according to the real-time transaction price of the world mainstream exchanges, which is absolutely fair;
msg.pg.index.bcexContspecty4=4. no system sharing, real-time settlement of earnings.\u00A0Btcside\u00A0contract transactions fundamentally solve the problem of \u201Csystem sharing\u201D and \u201Creal-time settlement\u201D and reduce the risk of user transactions.
msg.pg.index.bcexRecognize=Before you participate in contracts, you must understand:
msg.pg.index.bcexBlockRisk=Block chain assets industry is an emerging industry, there is a bright future, but because things are new, but also contains a huge risk. Especially in contract leveraged trading, the contract leverage multiples simultaneously expands the profit and simultaneously amplifies the risk. Please be sure to participate in the industry, the contract leveraged trading model, and the trading rules. And we strongly recommend that you trade within the risk you can afford.
msg.pg.index.bcexMoreRule=For more details , please refer to the Btcside website contract trading rules and the <<Service Agreement>>.
msg.pg.index.bcexConsentRule=If you agree to <<this risk tip>>, it means that you have fully understood the relevant rules of Btcside contract transaction and can bear the relevant risks of contract transaction, otherwise, please leave this page.
msg.pg.index.bcexConsent=Agree
msg.pg.index.bcexLeave=Leave
